<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Numvero is a beautiful, fast and private online calculator for everyday calculations.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website"><meta property="og:title" content="Numvero — Online Calculator"><meta property="og:description" content="Fast, clean and private calculator with history, memory, keyboard support and dark mode."><meta property="og:url" content="https://bankarshashank47-cloud.github.io/Numvero/">
<link rel="canonical" href="https://bankarshashank47-cloud.github.io/Numvero/"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Numvero — Online Calculator</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-glow" aria-hidden="true"></div>
<main class="site">
<header class="topbar"><a class="brand" href="./" aria-label="Numvero home"><span class="logo">N</span><span>numvero</span></a><div class="top-actions"><button id="themeBtn" class="round-btn" type="button" aria-label="Switch theme">☾</button><button id="shareBtn" class="round-btn" type="button" aria-label="Share calculation">↗</button></div></header>
<div class="layout">
<section class="calculator" aria-label="Numvero calculator">
<div class="display-card"><div class="display-label">CALCULATION</div><div id="expression" class="expression" aria-live="polite">0</div><div class="answer-line"><output id="display" class="display" aria-label="Calculator result">0</output><button id="copyResult" class="copy-btn" type="button" aria-label="Copy result">Copy</button></div><div id="status" class="status" aria-live="assertive"></div></div>
<div class="memory" aria-label="Memory controls"><button data-memory="MC" type="button">MC</button><button data-memory="MR" type="button">MR</button><button data-memory="M+" type="button">M+</button><button data-memory="M-" type="button">M−</button></div>
<div class="keypad" id="keypad">
<button class="soft danger" data-action="clear" type="button">AC</button><button class="soft" data-action="clearEntry" type="button">C</button><button class="soft" data-action="backspace" type="button" aria-label="Backspace">⌫</button><button class="soft" data-value="(" type="button">(</button><button class="soft" data-value=")" type="button">)</button><button class="op" data-value="÷" type="button">÷</button>
<button data-value="7" type="button">7</button><button data-value="8" type="button">8</button><button data-value="9" type="button">9</button><button class="op" data-value="×" type="button">×</button><button class="op" data-value="%" type="button">%</button>
<button data-value="4" type="button">4</button><button data-value="5" type="button">5</button><button data-value="6" type="button">6</button><button class="op" data-value="−" type="button">−</button><button class="utility" data-action="undo" type="button" aria-label="Undo">↶</button>
<button data-value="1" type="button">1</button><button data-value="2" type="button">2</button><button data-value="3" type="button">3</button><button class="op" data-value="+" type="button">+</button><button class="utility" data-action="redo" type="button" aria-label="Redo">↷</button>
<button class="utility" data-action="sign" type="button" aria-label="Positive or negative">±</button><button class="zero" data-value="0" type="button">0</button><button data-value="." type="button">.</button><button class="equals" data-action="equals" type="button">=</button>
</div>
<p class="keyboard-hint"><kbd>Enter</kbd> equals <span>•</span> <kbd>Esc</kbd> clear <span>•</span> <kbd>⌫</kbd> delete</p>
</section>
<aside class="history-card" aria-labelledby="historyTitle"><div class="history-head"><div><span class="eyebrow">YOUR WORK</span><h2 id="historyTitle">History</h2></div><button id="clearHistory" class="clear-history" type="button">Clear all</button></div><div id="history" class="history-list"><div class="empty">Your calculations will appear here.</div></div></aside>
</div>
<footer><span>NUMVERO</span><span>Fast · Private · No tracking</span></footer>
</main><noscript><div class="noscript">Numvero needs JavaScript enabled.</div></noscript><script src="app.js" defer></script>
</body></html>

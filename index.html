<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Numvero is a fast, private online calculator with history, memory, keyboard support, light and dark themes, and accurate expression handling.">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Numvero — Fast Online Calculator">
  <meta property="og:description" content="A clean, fast calculator for everyday calculations. No login. No tracking. Works on mobile and desktop.">
  <meta property="og:url" content="https://bankarshashank47-cloud.github.io/Numvero/">
  <link rel="canonical" href="https://bankarshashank47-cloud.github.io/Numvero/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Numvero — Fast Online Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Numvero home"><span class="brand-mark">N</span><span>Numvero</span></a>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">☾</button>
        <button class="icon-btn" id="shareBtn" type="button" aria-label="Share calculation" title="Share calculation">↗</button>
      </div>
    </header>

    <section class="calculator" aria-label="Numvero calculator">
      <div class="display-panel">
        <div id="expression" class="expression" aria-live="polite">0</div>
        <div class="result-row"><output id="display" class="display" aria-label="Calculator result">0</output><button id="copyResult" class="copy-btn" type="button" aria-label="Copy result">Copy</button></div>
        <div id="status" class="status" aria-live="assertive"></div>
      </div>

      <div class="memory-row" aria-label="Memory controls">
        <button data-memory="MC" type="button">MC</button><button data-memory="MR" type="button">MR</button><button data-memory="M+" type="button">M+</button><button data-memory="M-" type="button">M−</button>
      </div>

      <div class="keypad" id="keypad">
        <button class="danger" data-action="clear" type="button">AC</button><button data-action="backspace" type="button" aria-label="Backspace">⌫</button><button data-value="(" type="button">(</button><button data-value=")" type="button">)</button><button class="operator" data-value="÷" type="button">÷</button>
        <button data-value="7" type="button">7</button><button data-value="8" type="button">8</button><button data-value="9" type="button">9</button><button class="operator" data-value="×" type="button">×</button><button data-value="%" type="button">%</button>
        <button data-value="4" type="button">4</button><button data-value="5" type="button">5</button><button data-value="6" type="button">6</button><button class="operator" data-value="−" type="button">−</button><button data-action="undo" type="button" aria-label="Undo">↶</button>
        <button data-value="1" type="button">1</button><button data-value="2" type="button">2</button><button data-value="3" type="button">3</button><button class="operator" data-value="+" type="button">+</button><button data-action="redo" type="button" aria-label="Redo">↷</button>
        <button data-action="sign" type="button" aria-label="Positive or negative">±</button><button data-value="0" class="zero" type="button">0</button><button data-value="." type="button">.</button><button class="equals" data-action="equals" type="button">=</button>
      </div>
    </section>

    <section class="history-card" aria-labelledby="historyTitle">
      <div class="section-heading"><div><h2 id="historyTitle">History</h2><p>Your calculations stay on this device.</p></div><button id="clearHistory" class="text-btn" type="button">Clear all</button></div>
      <div id="history" class="history-list"><div class="empty">No calculations yet.</div></div>
    </section>

    <footer>Numvero · Private by default · <span>Runs entirely in your browser</span></footer>
  </main>
  <noscript><div class="noscript">Numvero needs JavaScript enabled to calculate.</div></noscript>
  <script src="app.js" defer></script>
</body>
</html>
